# Production variant with TLS. Mount certificates at /etc/nginx/certs
# (e.g. from Let's Encrypt / certbot) and use this file instead of nginx.conf.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  client_max_body_size 6m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  upstream monetra_api { server api:4000; keepalive 16; }
  upstream monetra_web { server web:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location ~ ^/api/v1/auth/(login|register|password|login/mfa) { limit_req zone=auth burst=10 nodelay; proxy_pass http://monetra_api; }
    location /api/ { limit_req zone=api burst=60 nodelay; proxy_pass http://monetra_api; }
    location /_next/static/ { proxy_pass http://monetra_web; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { proxy_pass http://monetra_web; }
  }
}
