# Monetra reverse proxy: one origin for the web app and the API so the
# refresh-token cookie stays first-party (SameSite=Strict).
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 30s;
  client_max_body_size 6m;            # receipts are limited to 5 MB by the API

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent" $request_id';
  access_log /var/log/nginx/access.log main;

  # Coarse edge rate limits; the API applies finer per-route limits.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  upstream monetra_api { server api:4000; keepalive 16; }
  upstream monetra_web { server web:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /health { proxy_pass http://monetra_api/health; access_log off; }

    location ~ ^/api/v1/auth/(login|register|password|login/mfa) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://monetra_api;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://monetra_api;
      proxy_read_timeout 60s;
    }

    location /_next/static/ {
      proxy_pass http://monetra_web;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://monetra_web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
